name: Deploy a OCI

# Cada push a main actualiza la app en la VM de Oracle Cloud por SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar la app en la VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/agente_ia_challengue_alura
            git fetch origin main
            git reset --hard origin/main      # deja la VM igual a main (descarta cambios locales)
            source .venv/bin/activate
            pip install -q -r requirements.txt
            sudo systemctl restart techretai
            echo "Deploy completado."
